<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSIDE THE COMPUTER | 3D Digital Architecture</title>

<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020407;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

button{
    font-family:inherit;
}

/* =========================================================
   BOOT SCREEN
========================================================= */

#bootScreen{
    position:fixed;
    inset:0;
    z-index:99999;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #09232e 0%,
            #020a10 35%,
            #010204 75%,
            #000 100%
        );

    transition:opacity 1s ease;
}

.boot-small{
    color:#6deeff;
    font-size:11px;
    letter-spacing:6px;
    margin-bottom:20px;
}

.boot-title{
    font-size:clamp(40px,8vw,100px);
    font-weight:900;
    letter-spacing:12px;
    text-align:center;

    color:#eaffff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff,
        0 0 80px #007bff;
}

.boot-subtitle{
    margin-top:15px;
    color:#8da7ad;
    letter-spacing:4px;
    font-size:12px;
    text-align:center;
}

.boot-progress{
    margin-top:45px;
    width:min(420px,75vw);
    height:3px;
    background:#10252c;
    overflow:hidden;
}

.boot-progress-bar{
    width:0%;
    height:100%;
    background:#00eaff;
    box-shadow:0 0 20px #00eaff;

    animation:
        bootProgress 3.5s
        forwards;
}

@keyframes bootProgress{
    100%{
        width:100%;
    }
}

#enterSystem{
    margin-top:35px;

    padding:13px 32px;

    background:rgba(0,20,28,.7);

    border:1px solid #00eaff;

    color:#00eaff;

    letter-spacing:4px;
    font-size:11px;

    cursor:pointer;

    box-shadow:
        0 0 10px rgba(0,234,255,.1);

    transition:.3s;
}

#enterSystem:hover{
    color:#001014;
    background:#00eaff;

    box-shadow:
        0 0 15px #00eaff,
        0 0 40px rgba(0,234,255,.5);
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;

    z-index:500;

    pointer-events:none;
}

.hud-left{
    position:absolute;
    top:25px;
    left:28px;
}

.hud-logo{
    font-size:17px;
    font-weight:bold;
    letter-spacing:4px;

    color:#00eaff;

    text-shadow:
        0 0 10px #00eaff;
}

.hud-system{
    margin-top:7px;

    color:#73ffbd;

    font-size:9px;
    letter-spacing:3px;
}

.hud-right{
    position:absolute;
    top:25px;
    right:28px;

    text-align:right;
}

#sector{
    color:#00eaff;
    font-size:10px;
    letter-spacing:3px;
}

#systemStats{
    margin-top:7px;

    color:#73ffbd;

    font-size:9px;
    letter-spacing:2px;
}

.crosshair{
    position:absolute;

    top:50%;
    left:50%;

    width:22px;
    height:22px;

    transform:translate(-50%,-50%);
}

.crosshair::before,
.crosshair::after{
    content:"";

    position:absolute;

    background:#00eaff;

    box-shadow:0 0 8px #00eaff;
}

.crosshair::before{
    width:22px;
    height:1px;

    left:0;
    top:11px;
}

.crosshair::after{
    width:1px;
    height:22px;

    left:11px;
    top:0;
}

.hud-bottom{
    position:absolute;

    bottom:23px;
    left:28px;

    color:#65777d;

    font-size:9px;
    letter-spacing:2px;
}

#tourButton{
    position:absolute;

    bottom:20px;
    right:28px;

    pointer-events:auto;

    background:rgba(1,10,16,.9);

    color:#00eaff;

    border:1px solid #00eaff;

    padding:11px 18px;

    font-size:9px;
    letter-spacing:3px;

    cursor:pointer;

    transition:.3s;
}

#tourButton:hover{
    background:#00eaff;
    color:#001015;

    box-shadow:0 0 25px #00eaff;
}

/* =========================================================
   COMPONENT INFORMATION PANEL
========================================================= */

#componentPanel{
    position:fixed;

    z-index:1000;

    right:30px;
    top:50%;

    width:360px;
    max-width:calc(100vw - 40px);

    transform:
        translateY(-50%)
        translateX(120%);

    background:
        linear-gradient(
            145deg,
            rgba(4,17,25,.97),
            rgba(1,6,10,.97)
        );

    border:1px solid #00eaff;

    box-shadow:
        0 0 30px rgba(0,234,255,.25),
        inset 0 0 35px rgba(0,234,255,.04);

    padding:25px;

    transition:.45s ease;

    pointer-events:auto;
}

#componentPanel.open{
    transform:
        translateY(-50%)
        translateX(0);
}

.panel-category{
    color:#73ffbd;

    font-size:9px;
    letter-spacing:4px;
}

#componentTitle{
    margin:10px 0 0;

    color:#00eaff;

    font-size:27px;
    letter-spacing:2px;
}

.panel-divider{
    height:1px;

    background:#16414a;

    margin:18px 0;
}

#componentDescription{
    color:#a8b9be;

    font-size:12px;

    line-height:1.7;
}

.spec-title{
    margin-top:20px;

    color:#657e85;

    font-size:9px;

    letter-spacing:3px;
}

#componentSpecs{
    margin-top:10px;

    display:flex;

    flex-wrap:wrap;

    gap:7px;
}

.spec{
    padding:5px 8px;

    border:1px solid #15515d;

    color:#6eeeff;

    font-size:9px;
}

#componentClose{
    position:absolute;

    right:14px;
    top:10px;

    border:none;
    background:none;

    color:#71868d;

    font-size:23px;

    cursor:pointer;
}

#componentClose:hover{
    color:#fff;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    .hud-left{
        left:14px;
        top:15px;
    }

    .hud-right{
        right:14px;
        top:15px;
    }

    .hud-bottom{
        left:14px;
        bottom:14px;
        font-size:7px;
    }

    #tourButton{
        right:14px;
        bottom:13px;

        padding:9px 12px;

        font-size:7px;
    }

    #componentPanel{
        left:20px;
        right:20px;

        width:auto;
    }

}

</style>
</head>

<body>


<!-- =========================================================
     BOOT SCREEN
========================================================= -->

<div id="bootScreen">

    <div class="boot-small">
        SYSTEM INITIALIZATION
    </div>

    <div class="boot-title">
        INSIDE
    </div>

    <div class="boot-title">
        THE COMPUTER
    </div>

    <div class="boot-subtitle">
        EXPLORE THE ARCHITECTURE BEHIND DIGITAL TECHNOLOGY
    </div>

    <div class="boot-progress">
        <div class="boot-progress-bar"></div>
    </div>

    <button id="enterSystem">
        ENTER COMPUTER
    </button>

</div>


<!-- =========================================================
     HUD
========================================================= -->

<div id="hud">

        <div class="hud-logo">

        </div>

        <div class="hud-system">

    </div>


    <div class="hud-right">

    </div>


    <div class="crosshair"></div>


    <div class="hud-bottom">
        WASD / ARROWS — MOVE &nbsp; • &nbsp;
        MOUSE — LOOK &nbsp; • &nbsp;
        CLICK — INSPECT
    </div>


    <button id="tourButton">
        SYSTEM TOUR
    </button>

</div>


<!-- =========================================================
     COMPONENT PANEL
========================================================= -->

<div id="componentPanel">

    <button id="componentClose">
        ×
    </button>

    <div class="panel-category">
        HARDWARE COMPONENT
    </div>

    <h2 id="componentTitle">
        CPU
    </h2>

    <div class="panel-divider"></div>

    <div id="componentDescription">
        Component description.
    </div>

    <div class="spec-title">
        CORE TECHNOLOGIES
    </div>

    <div id="componentSpecs"></div>

</div>


<!-- =========================================================
     A-FRAME
========================================================= -->

<a-scene

    renderer="
        antialias:true;
        colorManagement:true;
        physicallyCorrectLights:true;
    "

    fog="
        type:exponential;
        color:#020810;
        density:.010;
    "
>


<!-- =========================================================
     LIGHTING
========================================================= -->

        type:ambient;
        color:#18343e;
        intensity:.75;
    ">
</a-entity>


<a-entity
    position="0 10 0"
    light="
        type:point;
        color:#00eaff;
        intensity:8;
        distance:40;
    ">
</a-entity>


<a-entity
    position="-15 6 -10"
    light="
        type:point;
        color:#0066ff;
        intensity:5;
        distance:30;
    ">
</a-entity>


<a-entity
    position="15 5 -10"
    light="
        type:point;
        color:#ff00d4;
        intensity:5;
        distance:30;
    ">
</a-entity>


<a-entity
    position="0 3 -20"
    light="
        type:point;
        color:#73ffbd;
        intensity:3;
        distance:25;
    ">
</a-entity>


<!-- =========================================================
     CAMERA
========================================================= -->

<a-entity
    id="player"
    position="0 2 17"
>

        id="camera"

        wasd-controls="
            acceleration:35;
            fly:true;
        "

        look-controls="
            pointerLockEnabled:false;
        "

        position="0 0 0"
    >

        <a-cursor
            color="#00eaff"

            raycaster="
                objects:.interactive;
            "

            fuse="false"
        >
        </a-cursor>

    </a-camera>

</a-entity>


<!-- =========================================================
     COMPUTER CASE
========================================================= -->

<!-- LEFT WALL -->

<a-box
    position="-23 7 0"
    width="1"
    height="15"
    depth="48"

    material="
        color:#020a10;
        metalness:.9;
        roughness:.25;
    "
>
</a-box>


<!-- RIGHT WALL -->

<a-box
    position="23 7 0"

    depth="48"

    material="
        color:#020a10;

    "
>
</a-box>


<!-- BACK WALL -->

<a-box
    position="0 7 -24"

    height="15"
    depth="1"

    material="
        color:#020a10;

        roughness:.25;
    "
>
</a-box>


<!-- =========================================================
     FLOOR / MOTHERBOARD
========================================================= -->

<a-box
    position="0 .15 -4"

    width="42"
    height=".3"
    depth="40"

    material="
        color:#031218;
        metalness:.85;
        roughness:.3;
    "
>
</a-box>


<!-- =========================================================
     FLOOR GRID
========================================================= -->

<a-entity id="floorGrid"></a-entity>


<!-- =========================================================
     MOTHERBOARD TRACES
========================================================= -->

<a-entity id="traces"></a-entity>


<!-- =========================================================
     MAINBOARD
========================================================= -->

<a-box
    position="0 .55 -7"

    width="29"
    height=".22"
    depth="24"

    material="
        color:#052018;
        emissive:#001d16;
        emissiveIntensity:1;
        metalness:.8;
        roughness:.3;
    "
>
</a-box>


<!-- =========================================================
     CPU
========================================================= -->

<a-entity
    id="CPU"
    class="interactive"

    component-info="
        name:CPU — CENTRAL PROCESSING UNIT;
        description:The CPU is the primary general-purpose processor. It executes instructions, performs calculations, controls operations and coordinates the rest of the computer system.;
        specs:ALU|Control Unit|Registers|L1/L2/L3 Cache|Instruction Cycle|Clock Speed;
    "

    position="0 3.2 -7"
>


    <!-- CPU BODY -->

    <a-box
        width="4.5"
        height="1.8"
        depth="4.5"

        material="
            color:#081820;
            emissive:#00313b;
            emissiveIntensity:1.5;
            metalness:.9;
            roughness:.18;
        "
    >
    </a-box>


    <!-- CPU TOP -->

    <a-box
        width="3.6"
        height=".12"
        depth="3.6"

        position="0 .96 0"

        material="
            color:#00eaff;
            emissive:#00eaff;
            emissiveIntensity:3;
        "

        animation="
            property:material.emissiveIntensity;
            from:1;
            to:4;
            dir:alternate;
            loop:true;
            dur:900;
        "
    >
    </a-box>


    <a-text
        value="CPU"
        align="center"

        position="0 1.25 0"

        width="5"

        color="#ffffff"
    >
    </a-text>


</a-entity>


<!-- CPU SOCKET -->

<a-box
    position="0 1.1 -7"

    width="6"
    height=".1"
    depth="6"

    material="
        color:#001b21;
        emissive:#003642;
        emissiveIntensity:1;
    "
>
</a-box>


<!-- CPU ORBIT -->

<a-torus
    position="0 3.2 -7"

    rotation="90 0 0"

    radius="3.5"
    radius-tubular=".025"

    material="
        color:#00eaff;
        emissive:#00eaff;
        emissiveIntensity:3;
    "

    animation="
        property:rotation;
        to:90 360 0;
        loop:true;
        dur:8000;
        easing:linear;
    "
>
</a-torus>


<!-- =========================================================
     CPU COOLER
========================================================= -->

<a-entity
    id="CPU_COOLER"

    class="interactive"

    component-info="
        name:CPU COOLER;
        description:The CPU cooler removes heat generated by the processor. A cooler normally combines a heatsink with airflow to keep the CPU within a safe operating temperature.;
        specs:Heatsink|Fan|Thermal Transfer|Airflow|Temperature Control;
    "

    position="0 6 -7"
>


    <a-cylinder
        radius="2.7"
        height=".6"

        material="
            color:#111820;
            metalness:.9;
            roughness:.2;
        "
    >

    <a-cylinder

        height=".65"

            emissiveIntensity:1.5;

            to:0 360 0;
            loop:true;
            dur:700;
            easing:linear;
        "

    <a-torus
        radius="2.8"

        material="
            color:#00eaff;
            emissive:#00eaff;
            emissiveIntensity:2;
        "
    >
    </a-torus>


</a-entity>


<!-- =========================================================
     RAM
========================================================= -->

    class="interactive"

        name:RAM — RANDOM ACCESS MEMORY;
        description:RAM provides fast temporary storage for active programs and data. It is volatile memory, meaning its contents disappear when the system loses power.;
        specs:DDR|Memory Cells|Bandwidth|Latency|Volatile Memory|Dual Channel;

>

</a-entity>

     GPU
========================================================= -->

    component-info="
        name:GPU — GRAPHICS PROCESSING UNIT;

        specs:CUDA|Parallel Computing|Shaders|Tensor Cores|Rendering|AI;

    <a-text

    >
    </a-text>

</a-entity>


<!-- =========================================================
     HDD
========================================================= -->

<a-entity
    id="HDD"

    class="interactive"

    component-info="
        name:HDD — HARD DISK DRIVE;
        description:A traditional storage device that stores information magnetically on rotating platters. It offers high capacity at relatively low cost.;

>

        height=".7"

        material="

        "
    >
    </a-cylinder>

<!-- =========================================================
     PSU
========================================================= -->

<a-entity
    id="PSU"

    class="interactive"

    component-info="
        name:PSU — POWER SUPPLY UNIT;
        description:The PSU converts electrical power from an external source into regulated voltages required by the motherboard, CPU, GPU, storage and other components.;
        specs:AC/DC Conversion|12V Rail|Efficiency|Modular Cables|Power Delivery;
    "

    position="-13 2 -6"
>


    <a-box
        width="5"
        height="3"
        depth="5"

        material="
            color:#111315;
            metalness:.85;
            roughness:.35;
        "
    >
    </a-box>


    <a-cylinder
        radius="1.3"

<script>

/* =========================================================
   COMPONENT INFORMATION SYSTEM
========================================================= */

AFRAME.registerComponent(
    "component-info",
    {

        schema:{

            name:{
                type:"string"
            },

            description:{
                type:"string"
            },

            specs:{
                type:"string"
            }

        },


        init:function(){

            const element=this.el;


            element.classList.add(
                "interactive"
            );


            /* HOVER */

            element.addEventListener(
                "mouseenter",
                ()=>{

                    element.setAttribute(
                        "animation__hover",
                        {
                            property:"scale",

                            to:"1.08 1.08 1.08",

                            dur:250,

                            easing:"easeOutQuad"
                        }
                    );

                }
            );


            element.addEventListener(
                "mouseleave",
                ()=>{

                    element.setAttribute(
                        "animation__hover",
                        {
                            property:"scale",

                            to:"1 1 1",

                            dur:250,

                            easing:"easeOutQuad"
                        }
                    );

                }
            );


            /* CLICK */

            element.addEventListener(
                "click",
                ()=>{

                    openComponent(
                        this.data.name,
                        this.data.description,
                        this.data.specs
                    );

                }
            );

        }

    }
);


/* =========================================================
   PANEL
========================================================= */

const panel=
document.getElementById(
    "componentPanel"
);

const title=
document.getElementById(
    "componentTitle"
);

const description=
document.getElementById(
    "componentDescription"
);

const specs=
document.getElementById(
    "componentSpecs"
);


function openComponent(
    componentName,
    componentDescription,
    componentSpecs
){

    title.textContent=
        componentName;

    description.textContent=
        componentDescription;

    specs.innerHTML="";


    componentSpecs
        .split("|")
        .forEach(
            item=>{

                const span=
                    document.createElement(
                        "div"
                    );

                span.className=
                    "spec";

                span.textContent=
                    item;

                specs.appendChild(
                    span
                );

            }
        );


    panel.classList.add(
        "open"
    );

}


/* CLOSE */

document
    .getElementById(
        "componentClose"
    )
    .addEventListener(
        "click",
        ()=>{

            panel.classList.remove(
                "open"
            );

        }
    );


/* ESC */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key==="Escape"
        ){

            panel.classList.remove(
                "open"
            );

        }

    }
);


/* =========================================================
   FLOOR GRID
========================================================= */

const floorGrid=
document.getElementById(
    "floorGrid"
);


for(
    let x=-21;
    x<=21;
    x+=2
){

    const line=
        document.createElement(
            "a-box"
        );

    line.setAttribute(
        "position",
        `${x} .32 -4`
    );

    line.setAttribute(
        "width",
        ".012"
    );

    line.setAttribute(
        "height",
        ".02"
    );

    line.setAttribute(
        "depth",
        "40"
    );

    line.setAttribute(
        "material",
        `
        color:#07343e;
        emissive:#07343e;
        emissiveIntensity:1
        `
    );

    floorGrid.appendChild(
        line
    );

}


for(
    let z=-24;
    z<=16;
    z+=2
){

    const line=
        document.createElement(
            "a-box"
        );

    line.setAttribute(
        "position",
        `0 .33 ${z}`
    );

    line.setAttribute(
        "width",
        "42"
    );

    line.setAttribute(
        "height",
        ".02"
    );

    line.setAttribute(
        "depth",
        ".012"
    );

    line.setAttribute(
        "material",
        `
        color:#07343e;
        emissive:#07343e;
        emissiveIntensity:1
        `
    );

    floorGrid.appendChild(
        line
    );

}


/* =========================================================
   MOTHERBOARD CIRCUITS
========================================================= */

const traces=
document.getElementById(
    "traces"
);


function createTrace(
    x,
    y,
    z,
    width,
    depth,
    color="#00eaff"
){

    const trace=
        document.createElement(
            "a-box"
        );


    trace.setAttribute(
        "position",
        `${x} ${y} ${z}`
    );


    trace.setAttribute(
        "width",
        width
    );


    trace.setAttribute(
        "height",
        ".025"
    );


    trace.setAttribute(
        "depth",
        depth
    );


    trace.setAttribute(
        "material",
        `
        color:${color};
        emissive:${color};
        emissiveIntensity:2
        `
    );


    traces.appendChild(
        trace
    );

}


/* Horizontal traces */

createTrace(
    -13,
    .72,
    -4,
    12,
    .04
);

createTrace(
    13,
    .72,
    -4,
    12,
    .04
);

createTrace(
    -10,
    .72,
    -8,
    7,
    .04
);

createTrace(
    10,
    .72,
    -8,
    7,
    .04
);


/* Vertical traces */

createTrace(
    -5,
    .73,
    -9,
    .04,
    9
);

createTrace(
    5,
    .73,
    -9,
    .04,
    9
);

createTrace(
    0,
    .73,
    -15,
    .04,
    8
);


/* =========================================================
   COOLER FINS
========================================================= */

const fins=
document.getElementById(
    "fins"
);


for(
    let i=-5;
    i<=5;
    i++
){

    const fin=
        document.createElement(
            "a-box"
        );

    fin.setAttribute(
        "position",
        `${i*.25} 0 0`
    );

    fin.setAttribute(
        "width",
        ".12"
    );

    fin.setAttribute(
        "height",
        "2.8"
    );

    fin.setAttribute(
        "depth",
        "2.7"
    );

    fin.setAttribute(
        "material",
        `
        color:#69777b;
        metalness:.9;
        roughness:.2
        `
    );

    fins.appendChild(
        fin
    );

}


/* =========================================================
   DATA CABLES
========================================================= */

const cables=
document.getElementById(
    "cables"
);


function createCable(
    start,
    end,
    color
){

    const midX=
        (start.x+end.x)/2;

    const midY=
        (start.y+end.y)/2;

    const midZ=
        (start.z+end.z)/2;


    const distance=
        Math.sqrt(
            Math.pow(
                end.x-start.x,
                2
            )
            +
            Math.pow(
                end.z-start.z,
                2
            )
        );


    const cable=
        document.createElement(
            "a-cylinder"
        );


    cable.setAttribute(
        "radius",
        ".035"
    );


    cable.setAttribute(
        "height",
        distance
    );


    cable.setAttribute(
        "position",
        `${midX} ${midY} ${midZ}`
    );


    cable.setAttribute(
        "material",
        `
        color:${color};
        emissive:${color};
        emissiveIntensity:2
        `
    );


    cable.object3D.rotation.x=
        Math.PI/2;


    cables.appendChild(
        cable
    );

}

/* =========================================================
   SECTOR DETECTION
========================================================= */

const player=
document.getElementById(
    "player"
);

const sector=
document.getElementById(
    "sector"
);


setInterval(
    ()=>{

        const position=
            player.object3D.position;


        if(
            position.z>8
        ){

            sector.textContent=
                "SECTOR: INPUT / ENTRY";

        }

        else if(
            position.z>-4
        ){

            sector.textContent=
                "SECTOR: POWER / MAINBOARD";

        }

        else if(
            position.z>-10
        ){

            sector.textContent=
                "SECTOR: PROCESSING";

        }

        else if(
            position.z>-17
        ){

            sector.textContent=
                "SECTOR: MEMORY / STORAGE";

        }

        else{

            sector.textContent=
                "SECTOR: NETWORK / SOFTWARE";

        }

    },

    300
);


/* =========================================================
   GUIDED SYSTEM TOUR
========================================================= */

const tourButton=
document.getElementById(
    "tourButton"
);


let tourRunning=
    false;


const tourStops=[

    {
        position:"0 2 16",
        duration:2000,
        name:"SYSTEM ENTRY"
    },

    {
        position:"0 4 0",
        duration:2200,
        name:"MAINBOARD"
    },

    {
        position:"0 3 -7",
        duration:2200,
        name:"CPU"
    },

    {
        position:"-7 3 -7",
        duration:2000,
        name:"RAM"
    },

    {
        position:"9 3 -6",
        duration:2000,
        name:"SSD"
    },

    {
        position:"0 3 -12",
        duration:2200,
        name:"GPU"
    },

    {
        position:"-13 3 -6",
        duration:2200,
        name:"POWER SUPPLY"
    },

    {
        position:"13 4 -15",
        duration:2200,
        name:"NETWORK"
    },

    {
        position:"0 4 -22",
        duration:2500,
        name:"OPERATING SYSTEM"
    }

];


tourButton.addEventListener(
    "click",
    ()=>{

        if(tourRunning)
            return;


        tourRunning=true;

        tourButton.textContent=
            "TOUR RUNNING";

        runTour(0);

    }
);


function runTour(index){

    if(
        index>=tourStops.length
    ){

        tourRunning=false;

        tourButton.textContent=
            "REPLAY TOUR";

        return;

    }


    const stop=
        tourStops[index];


    player.setAttribute(
        "animation__tour",
        `
        property:position;
        to:${stop.position};
        dur:${stop.duration};
        easing:easeInOutCubic
        `
    );


    sector.textContent=
        "TOUR: "+stop.name;


    setTimeout(
        ()=>{

            runTour(index+1);

        },

        stop.duration+500
    );

}
