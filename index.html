<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSIDE THE COMPUTER — 3D Experience</title>

<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#020409;
    overflow:hidden;
    color:white;
}

/* =========================
   LOADING SCREEN
========================= */

#loading{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,#071927 0%,#020409 55%,#000 100%);
    z-index:9999;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity 1s ease;
}

.loading-title{
    font-size:clamp(35px,7vw,85px);
    letter-spacing:12px;
    font-weight:900;
    text-align:center;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff,
        0 0 80px #006eff;
}

.loading-sub{
    margin-top:15px;
    color:#8aefff;
    letter-spacing:5px;
    font-size:13px;
}

.loader{
    width:300px;
    height:3px;
    background:#10232b;
    margin-top:40px;
    overflow:hidden;
}

.loader-bar{
    height:100%;
    width:0%;
    background:#00eaff;
    box-shadow:0 0 20px #00eaff;
    animation:load 3s forwards;
}

@keyframes load{
    to{width:100%}
}

#enterBtn{
    margin-top:35px;
    padding:14px 35px;
    background:transparent;
    border:1px solid #00eaff;
    color:#00eaff;
    letter-spacing:4px;
    cursor:pointer;
    transition:.3s;
}

#enterBtn:hover{
    background:#00eaff;
    color:#001016;
    box-shadow:0 0 30px #00eaff;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:100;
}

.top-left{
    position:absolute;
    top:25px;
    left:30px;
}

.logo{
    font-size:19px;
    font-weight:bold;
    letter-spacing:5px;
    color:#00eaff;
    text-shadow:0 0 12px #00eaff;
}

.system{
    font-size:10px;
    color:#73ffbd;
    letter-spacing:3px;
    margin-top:7px;
}

.top-right{
    position:absolute;
    top:25px;
    right:30px;
    text-align:right;
}

#location{
    color:#00eaff;
    font-size:11px;
    letter-spacing:3px;
}

#status{
    margin-top:8px;
    color:#73ffbd;
    font-size:10px;
}

.crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:18px;
    height:18px;
}

.crosshair:before,
.crosshair:after{
    content:"";
    position:absolute;
    background:#00eaff;
    box-shadow:0 0 8px #00eaff;
}

.crosshair:before{
    width:18px;
    height:1px;
    top:9px;
}

.crosshair:after{
    width:1px;
    height:18px;
    left:9px;
}

.bottom{
    position:absolute;
    bottom:25px;
    left:30px;
    font-size:10px;
    color:#7c8b95;
    letter-spacing:2px;
}

#tourBtn{
    position:absolute;
    bottom:25px;
    right:30px;
    pointer-events:auto;
    padding:12px 20px;
    background:rgba(0,10,18,.8);
    border:1px solid #00eaff;
    color:#00eaff;
    cursor:pointer;
    letter-spacing:2px;
}

/* =========================
   COMPONENT PANEL
========================= */

#panel{
    position:fixed;
    top:50%;
    right:35px;
    transform:translateY(-50%) translateX(120%);
    width:330px;
    max-width:calc(100vw - 40px);
    background:rgba(3,10,17,.94);
    border:1px solid #00eaff;
    box-shadow:
        0 0 30px rgba(0,234,255,.25),
        inset 0 0 30px rgba(0,234,255,.04);
    padding:25px;
    z-index:300;
    transition:.5s ease;
    pointer-events:auto;
}

#panel.active{
    transform:translateY(-50%) translateX(0);
}

.panel-label{
    font-size:9px;
    color:#73ffbd;
    letter-spacing:4px;
}

#panel h2{
    margin-top:10px;
    color:#00eaff;
    font-size:30px;
    letter-spacing:3px;
}

#panel p{
    margin-top:15px;
    color:#b5c4ca;
    line-height:1.6;
    font-size:13px;
}

.tech{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:18px;
}

.tech span{
    padding:5px 8px;
    border:1px solid #1d6874;
    color:#6eeeff;
    font-size:9px;
}

.close{
    position:absolute;
    right:15px;
    top:12px;
    color:#fff;
    cursor:pointer;
    font-size:20px;
}

.panel-line{
    height:1px;
    background:#12353e;
    margin:20px 0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top-left{
        left:15px;
        top:15px;
    }

    .top-right{
        right:15px;
        top:15px;
    }

    .bottom{
        left:15px;
        bottom:15px;
    }

    #tourBtn{
        right:15px;
        bottom:15px;
        padding:9px 12px;
    }

    #panel{
        right:20px;
        left:20px;
        width:auto;
    }

}

</style>
</head>

<!-- =========================

    },

    ai:{
        title:"AI ENGINE — INTELLIGENCE LAYER",
        description:
        "The intelligence layer transforms data into predictions, decisions and generated outputs using machine learning and modern AI systems.",
        tech:["Machine Learning","Neural Networks","LLMs","Generative AI","Agents"]
    },

    os:{
        title:"OPERATING SYSTEM",
        description:
        "The operating system manages hardware, memory, processes, files and interaction between applications and the underlying computer.",
        tech:["Processes","Threads","Memory Management","File Systems","Kernel"]
    }

};


/* =====================================
   INTERACTIVE COMPONENT
===================================== */

AFRAME.registerComponent("computer-component",{

    schema:{
        title:{type:"string"},
        description:{type:"string"},
        tech:{type:"string"}
    },

    init:function(){

        const el=this.el;

        el.classList.add("interactive");

        el.addEventListener("mouseenter",()=>{

            el.setAttribute(
                "animation__hover",
                {
                    property:"scale",
                    to:"1.08 1.08 1.08",
                    dur:250,
                    easing:"easeOutQuad"
                }
            );

        });

        el.addEventListener("mouseleave",()=>{

            el.setAttribute(
                "animation__hover",
                {
                    property:"scale",
                    to:"1 1 1",
                    dur:250,
                    easing:"easeOutQuad"
                }
            );

        });

        el.addEventListener("click",()=>{

            openPanel(
                this.data.title,
                this.data.description,
                this.data.tech.split("|")
            );

        });

    }

});


/* =====================================
   PANEL
===================================== */

const panel=document.getElementById("panel");

const panelTitle=document.getElementById("panelTitle");

const panelDescription=
document.getElementById("panelDescription");

const panelTech=
document.getElementById("panelTech");


function openPanel(title,description,tech){

    panelTitle.textContent=title;

    panelDescription.textContent=description;

    panelTech.innerHTML="";

    tech.forEach(item=>{

        const tag=document.createElement("span");

        tag.textContent=item;

        panelTech.appendChild(tag);

    });

    panel.classList.add("active");

}


document
.getElementById("closePanel")
.addEventListener("click",()=>{

    panel.classList.remove("active");

});


/* =====================================
   FLOOR GRID
===================================== */

const grid=document.getElementById("grid");

for(let x=-20;x<=20;x+=2){

    const line=document.createElement("a-entity");

    line.setAttribute(
        "geometry",
        "primitive:box; width:.015; height:.02; depth:40"
    );

    line.setAttribute(
        "position",
        `${x} .02 -5`
    );

    line.setAttribute(
        "material",
        `
        color:#07343e;
        emissive:#07343e;
        emissiveIntensity:1
        `
    );

    grid.appendChild(line);

}


for(let z=-23;z<=15;z+=2){

    const line=document.createElement("a-entity");

    line.setAttribute(
        "geometry",
        "primitive:box; width:40; height:.02; depth:.015"
    );

    line.setAttribute(
        "position",
        `0 .025 ${z}`
    );

    line.setAttribute(
        "material",
        `
        color:#07343e;
        emissive:#07343e;
        emissiveIntensity:1
        `
    );

    grid.appendChild(line);

}


/* =====================================
   CIRCUIT CONNECTIONS
===================================== */

const circuits=document.getElementById("circuits");

function circuit(x,z,w,d){

    const line=document.createElement("a-box");

    line.setAttribute(
        "position",
        `${x} .36 ${z}`
    );

    line.setAttribute(
        "width",
        w
    );

    line.setAttribute(
        "height",
        ".025"
    );

    line.setAttribute(
        "depth",
        d
    );

    line.setAttribute(
        "material",
        `
        color:#00eaff;
        emissive:#00eaff;
        emissiveIntensity:2
        `
    );

    circuits.appendChild(line);

}


circuit(-5,-4,7,.04);
circuit(5,-4,7,.04);
circuit(0,-10,.04,10);
circuit(-7,-9,.04,5);
circuit(7,-9,.04,5);
circuit(-12,-7,5,.04);
circuit(12,-7,5,.04);


/* =====================================
   DATA TUNNEL
===================================== */

const tunnel=document.getElementById("dataTunnel");

for(let i=0;i<12;i++){

    const ring=document.createElement("a-torus");

    ring.setAttribute(
        "position",
        `0 ${2.5+i*.15} ${-2-i*1.3}`
    );

    ring.setAttribute(
        "rotation",
        "90 0 0"
    );

    ring.setAttribute(
        "radius",
        `${4+i*.1}`
    );

    ring.setAttribute(
        "radius-tubular",
        ".025"
    );

    ring.setAttribute(
        "material",
        `
        color:#00eaff;
        emissive:#00eaff;
        emissiveIntensity:2
        `
    );

    ring.setAttribute(
        "animation",
        `
        property:rotation;
        to:90 360 0;
        loop:true;
        dur:${5000+i*300};
        easing:linear
        `
    );

    tunnel.appendChild(ring);

}


/* =====================================
   PARTICLE FIELD
===================================== */

const particles=
document.getElementById("particles");

for(let i=0;i<250;i++){

    const p=document.createElement("a-sphere");

    const x=(Math.random()*40)-20;

    const y=Math.random()*14+.5;

    const z=(Math.random()*40)-24;

    const size=Math.random()*.035+.01;

    p.setAttribute(
        "position",
        `${x} ${y} ${z}`
    );

    p.setAttribute(
        "radius",
        size
    );

    p.setAttribute(
        "material",
        `
        color:#00eaff;
        emissive:#00eaff;
        emissiveIntensity:${Math.random()*3+1}
        `
    );

    p.setAttribute(
        "animation",
        `
        property:position;
        to:${x} ${y+Math.random()*2} ${z};
        dir:alternate;
        loop:true;
        dur:${3000+Math.random()*5000};
        easing:easeInOutSine
        `
    );

    particles.appendChild(p);

}


/* =====================================
   DATA PACKETS
===================================== */

const stream=
document.getElementById("dataStream");

for(let i=0;i<30;i++){

    const packet=document.createElement("a-box");

    packet.setAttribute(
        "width",".08"
    );

    packet.setAttribute(
        "height",".08"
    );

    packet.setAttribute(
        "depth",".08"
    );

    packet.setAttribute(
        "material",
        `
        color:#73ffbd;
        emissive:#73ffbd;
        emissiveIntensity:3
        `
    );

    const startX=-12+Math.random()*24;

    packet.setAttribute(
        "position",
        `${startX} .5 -4`
    );

    packet.setAttribute(
        "animation",
        `
        property:position;
        to:${12-Math.random()*24} .5 -4;
        loop:true;
        dur:${2000+Math.random()*3000};
        easing:linear;
        delay:${Math.random()*3000}
        `
    );

    stream.appendChild(packet);

}


/* =====================================
   CHAPTER DETECTION
===================================== */

const cameraRig=
document.getElementById("cameraRig");

const locationText=
document.getElementById("location");


setInterval(()=>{

    const pos=cameraRig.object3D.position;

    if(pos.z>5){

        locationText.textContent=
        "SECTOR: INPUT / ENTRY";

    }

    else if(pos.z>-8){

        locationText.textContent=
        "SECTOR: PROCESSING CORE";

    }

    else if(pos.z>-16){

        locationText.textContent=
        "SECTOR: COMPUTATION";

    }

    else{

        locationText.textContent=
        "SECTOR: INTELLIGENCE / OUTPUT";

    }

},300);


/* =====================================
   SYSTEM STATUS
===================================== */

const status=
document.getElementById("status");

setInterval(()=>{

    const cpu=
    Math.floor(20+Math.random()*60);

    const memory=
    Math.floor(40+Math.random()*45);

    status.textContent=
    `CPU LOAD ${cpu}% · MEMORY ${memory}%`;

},1000);


/* =====================================
   GUIDED TOUR
===================================== */

let touring=false;

const tourBtn=
document.getElementById("tourBtn");


const tourPoints=[

    {
        pos:"0 2 14",
        look:"0 2 0",
        label:"SYSTEM ENTRY"
    },

    {
        pos:"0 3 2",
        look:"0 3 -7",
        label:"CPU CORE"
    },

    {
        pos:"-9 3 -1",
        look:"0 3 -4",
        label:"MEMORY"
    },

    {
        pos:"9 3 -1",
        look:"0 3 -4",
        label:"STORAGE"
    },

    {
        pos:"0 3 -11",
        look:"0 2 -14",
        label:"GPU"
    },

    {
        pos:"-9 4 -10",
        look:"-11 4 -13",
        label:"NETWORK"
    },

    {
        pos:"9 4 -10",
        look:"11 4 -13",
        label:"AI ENGINE"
    },

    {
        pos:"0 4 -17",
        look:"0 4 -19",
        label:"OPERATING SYSTEM"
    }

];


tourBtn.addEventListener("click",()=>{

    if(touring) return;

    touring=true;

    runTour(0);

});


function runTour(index){

    if(index>=tourPoints.length){

        touring=false;

        tourBtn.textContent=
        "REPLAY SYSTEM TOUR";

        return;

    }

    const point=tourPoints[index];

    cameraRig.setAttribute(
        "animation__move",
        `
        property:position;
        to:${point.pos};
        dur:2500;
        easing:easeInOutCubic
        `
    );

    locationText.textContent=
    "TOUR: "+point.label;

    setTimeout(()=>{

        runTour(index+1);

    },3300);

}


/* =====================================
   ENTER SYSTEM
===================================== */

const loading=
document.getElementById("loading");

document
.getElementById("enterBtn")
.addEventListener("click",()=>{

    loading.style.opacity="0";

    setTimeout(()=>{

        loading.style.display="none";

    },1000);

});


/* =====================================
   ESC CLOSE PANEL
===================================== */

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){

        panel.classList.remove("active");

    }

});


/* =====================================
   RANDOM DIGITAL GLITCH
===================================== */

setInterval(()=>{

    const logo=
    document.querySelector(".logo");

    if(Math.random()>.8){

        logo.style.transform=
        `translateX(${Math.random()*4-2}px)`;

        setTimeout(()=>{

            logo.style.transform="";

        },100);

    }

},1000);

</script>

</body>
</html>
